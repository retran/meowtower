name: meowtower

# Both services run unprivileged (REQ-2512): no root user, no capabilities,
# no privilege escalation and a read-only root file system.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp"]
  restart: unless-stopped

services:
  # The game's database (ADR-3310). It sits on a network that has no route out and publishes no
  # port, so only the game reaches it; its data lives in the named volume meowtower-pg on the Mac
  # (REQ-2502, REQ-8520).
  postgres:
    <<: *hardened
    image: postgres:18-alpine
    user: postgres
    tmpfs: ["/tmp", "/var/run/postgresql"]
    environment:
      POSTGRES_DB: meowtower
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - meowtower-pg:/var/lib/postgresql
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meowtower"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The database the tests run against: data in memory, published on the loopback only, started
  # by the test run (tests/global-setup.ts) and never by the game.
  postgres-test:
    profiles: [test]
    image: postgres:18-alpine
    tmpfs: ["/var/lib/postgresql"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 30

  meowtower:
    <<: *hardened
    build: .
    user: node
    networks: [db, default]
    # The model key lives in .env on the Mac and reaches this service only
    # (REQ-2504).
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-UTC}
    # The Parent Room answers on the Mac's loopback only (REQ-2510).
    ports:
      - "127.0.0.1:${MEOWTOWER_PARENT_PORT:-8080}:3001"
    # The live database lives in the named volume; every other file is on the
    # Mac under data/ (REQ-2502).
    volumes:
      - meowtower-db:/var/lib/meowtower
      - ./data/blobs:/data/blobs
      - ./data/snapshots:/data/snapshots
      - ./data/exports:/data/exports

  proxy:
    <<: *hardened
    build: ./proxy
    user: "1000:1000"
    environment:
      TZ: ${TZ:-UTC}
      MEOWTOWER_HOST: ${MEOWTOWER_HOST:-localhost}
      XDG_CONFIG_HOME: /data/config
      XDG_DATA_HOME: /data
    ports:
      - "443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/setup:/srv/setup:ro
    depends_on:
      - meowtower

volumes:
  meowtower-db:
  meowtower-pg:

networks:
  db:
    internal: true
