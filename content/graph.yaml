sloGoals:
  - id: slo-getallen-1f-01
    level: 1F
    text: Понимание, произношение и запись целых чисел и простых дробей
  - id: slo-getallen-1f-03
    level: 1F
    text: Чтение и запись целых чисел, простых дробей и десятичных дробей
  - id: slo-getallen-1f-04
    level: 1F
    text: Использование специальных названий чисел (например, миллион, три четверти)
  - id: slo-getallen-1f-06
    level: 1F
    text: Позиционная десятичная система и числовой ряд
  - id: slo-getallen-1f-07
    level: 1F
    text: Использование числовой прямой с целыми и простыми десятичными числами
  - id: slo-getallen-1f-08
    level: 1F
    text: Перевод простой ситуации в математическое вычисление
  - id: slo-getallen-1f-09
    level: 1F
    text: Округление целых чисел до круглых
  - id: slo-getallen-1f-10
    level: 1F
    text: Приблизительная оценка результатов вычислений
